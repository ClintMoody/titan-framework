# ╔══════════════════════════════════════════════════════════════╗
# ║  ⚡ TITAN — PROJECT CONFIGURATION                           ║
# ╚══════════════════════════════════════════════════════════════╝
#
# This file defines the project configuration for TITAN.
# Generated by /titan:01-init — edit freely to match your project.
# All settings include explanatory comments.

# ── Project Metadata ──────────────────────────────────────────
project:
  # Human-readable project name (used in banners and reports)
  name: "{{PROJECT_NAME}}"

  # Project type: app | library | service | cli | monorepo
  type: "{{PROJECT_TYPE}}"

  # Semantic version (follows semver — major.minor.patch)
  version: "0.1.0"

  # Brief one-line description of what this project does
  description: "{{PROJECT_DESCRIPTION}}"

# ── Domain Configuration ──────────────────────────────────────
domain:
  # Primary domain determines default quality checks and patterns
  # Options: web | mobile | desktop | audio | game | data | api | infrastructure
  primary: "{{DOMAIN}}"

  # Additional domain plugins to load (combines checks from all plugins)
  # Example: ["web", "api"] for a full-stack web app with API layer
  plugins:
    - "{{DOMAIN}}"

# ── Model Profiles ────────────────────────────────────────────
# Three profiles trade off quality vs speed vs cost.
# Each profile assigns models to three roles:
#   planning  — architecture, exploration, decomposition
#   execution — code generation, implementation
#   review    — verification, quality checks, reconciliation
profiles:
  quality:
    # Maximum quality — use for critical systems, production releases
    planning: "claude-opus-4"
    execution: "claude-opus-4"
    review: "claude-opus-4"

  balanced:
    # Good tradeoff — use for most development work
    planning: "claude-opus-4"
    execution: "claude-sonnet-4"
    review: "claude-opus-4"

  budget:
    # Cost-efficient — use for scaffolding, boilerplate, exploration
    planning: "claude-sonnet-4"
    execution: "claude-sonnet-4"
    review: "claude-sonnet-4"

# ── Execution Strategy ────────────────────────────────────────
execution:
  # Tasks that MUST run in the current session (not spawned to agents)
  # These tasks are too risky or interconnected to run in isolated contexts
  prefer_in_session:
    - "integration"        # Cross-module integration requires full context
    - "safety-critical"    # Security/auth changes need human oversight
    - "refactoring"        # Refactors touch many files — need session awareness

  # Tasks suitable for parallel agent execution (isolated, well-bounded)
  prefer_agent:
    - "ui"                 # UI components are self-contained
    - "tests"              # Test files are independent
    - "documentation"      # Docs don't affect runtime code
    - "scaffolding"        # Boilerplate generation is isolated

# ── Git Configuration ─────────────────────────────────────────
git:
  # Each task = one atomic commit (no multi-task commits)
  atomic_commits: true

  # Automatically create feature branches per phase
  auto_branch: true

  # Branch naming pattern
  # {NN} = zero-padded phase number, {name} = slugified phase name
  branch_pattern: "titan/phase-{NN}-{name}"

  # Commit message format (enforced by TITAN)
  # {NN} = phase number, {description} = imperative description
  commit_format: "titan(phase-{NN}): {description}"

  # Never force-push — TITAN protects git history
  force_push: false

  # Commit verification — require all checks pass before commit
  verify_before_commit: true

# ── Reconciliation ────────────────────────────────────────────
# Reconciliation ensures STATE.md matches actual project state.
# Runs after every phase and before planning.
reconciliation:
  # Whether reconciliation is required (strongly recommended)
  mandatory: true

  # How much deviation from plan is tolerable before flagging
  # Options: strict | moderate | relaxed
  # strict   — any deviation requires explanation
  # moderate — minor deviations logged, major ones flagged
  # relaxed  — only blocking deviations flagged
  deviation_threshold: "moderate"

  # Cross-check STATE.md against filesystem and git history
  state_consistency_check: true

# ── Context Management ────────────────────────────────────────
# Controls how much context budget each plan consumes.
# Prevents context overflow in long sessions.
context:
  # Target context usage per plan (percentage of context window)
  # Lower = more room for execution, higher = more detailed plans
  target_per_plan: 50

  # Maximum tasks in a single plan (prevents overloaded phases)
  max_tasks_per_plan: 3

  # Context bracket definitions — classify context usage
  # Each bracket defines a range and visual indicator
  brackets:
    green:
      range: "0-50%"       # Comfortable — full planning capacity
      indicator: "◆"
    yellow:
      range: "50-70%"      # Caution — simplify plans, fewer tasks
      indicator: "⚠"
    orange:
      range: "70-85%"      # Warning — minimal plans, consider fresh session
      indicator: "⚠⚠"
    red:
      range: "85-100%"     # Critical — save state, start fresh session
      indicator: "⚠⚠⚠"

  # Auto-shard documents exceeding this line count
  # Creates numbered parts: DOCUMENT_PART_01.md, DOCUMENT_PART_02.md, etc.
  auto_shard_threshold: 500

# ── TDD Mode ──────────────────────────────────────────────────
# Test-Driven Development mode: write tests BEFORE implementation.
# When enabled, TITAN enforces red-green-refactor cycle.
tdd:
  # Enable TDD workflow (default: false — opt-in)
  enabled: false

  # Context budget target when TDD is active (lower because tests + impl)
  context_target: 40

# ── Autopilot Mode ────────────────────────────────────────────
# Autopilot allows TITAN to execute plans with minimal human intervention.
# Use with caution — recommended only after establishing trust with the framework.
autopilot:
  # Enable autopilot execution (default: false — opt-in)
  enabled: false

  # Pause at checkpoint tasks even in autopilot mode
  # Checkpoints are: human-verify, decision, human-action
  pause_on_checkpoints: true

  # Start each step with fresh context (prevents context drift)
  fresh_context_per_step: true

# ── Quality Score Target ──────────────────────────────────────
# TITAN aims for this quality score on all deliverables.
# Score is assessed by the verifier against domain quality gates.
quality:
  # Target score out of 10 (9.0+ recommended for production)
  target_score: 9.8

  # Minimum acceptable score (below this = phase fails)
  minimum_score: 8.0

  # Whether to run domain-specific quality gates
  domain_gates_enabled: true
