# ╔══════════════════════════════════════════════════════════════╗
# ║  ⚡ TITAN — PROJECT CONFIGURATION                           ║
# ╚══════════════════════════════════════════════════════════════╝
#
# This file defines the project configuration for TITAN.
# Generated by /titan:01-init — edit freely to match your project.
# All settings include explanatory comments.

# ── Project Metadata ──────────────────────────────────────────
project:
  # Human-readable project name (used in banners and reports)
  name: "{{PROJECT_NAME}}"

  # Project type: app | library | service | cli | monorepo
  type: "{{PROJECT_TYPE}}"

  # Semantic version (follows semver — major.minor.patch)
  version: "0.1.0"

  # Brief one-line description of what this project does
  description: "{{PROJECT_DESCRIPTION}}"

# ── Domain Configuration ──────────────────────────────────────
domain:
  # Primary domain determines default quality checks and patterns
  # Options: web | mobile | desktop | audio | game | data | api | infrastructure
  primary: "{{DOMAIN}}"

  # Additional domain plugins to load (combines checks from all plugins)
  # Example: ["web", "api"] for a full-stack web app with API layer
  plugins:
    - "{{DOMAIN}}"

# ── Model Profiles ────────────────────────────────────────────
# Three profiles trade off quality vs speed vs cost.
# Each profile assigns models to three roles:
#   planning  — architecture, exploration, decomposition
#   execution — code generation, implementation
#   review    — verification, quality checks, reconciliation
profiles:
  quality:
    # Maximum quality — use for critical systems, production releases
    planning: "claude-opus-4"
    execution: "claude-opus-4"
    review: "claude-opus-4"

  balanced:
    # Good tradeoff — use for most development work
    planning: "claude-opus-4"
    execution: "claude-sonnet-4"
    review: "claude-opus-4"

  budget:
    # Cost-efficient — use for scaffolding, boilerplate, exploration
    planning: "claude-sonnet-4"
    execution: "claude-sonnet-4"
    review: "claude-sonnet-4"

# ── Dynamic Model Routing (Cannibalized from GSD-2) ─────────
# When enabled, TITAN classifies each task by complexity and
# overrides the static profile with a more cost-efficient model
# when appropriate. This can reduce token costs 40-60% without
# sacrificing quality on tasks that need it.
#
# Classification heuristics (sub-millisecond, no LLM call):
#   light    — ≤3 steps, ≤3 files, simple description
#   standard — typical work
#   heavy    — ≥8 steps, ≥8 files, keywords like "migrate", "security", "refactor"
#
# When dynamic_routing is enabled, light tasks may be downgraded
# from the profile's model. Heavy tasks are NEVER downgraded.
dynamic_routing:
  # Enable complexity-based model routing
  enabled: false

  # Override map: which model to use when a task is classified as "light"
  # Heavy tasks always use the profile's assigned model.
  # Standard tasks use the profile's assigned model.
  light_override:
    planning: "claude-sonnet-4"
    execution: "claude-haiku-4-5"
    review: "claude-sonnet-4"

  # Budget pressure thresholds (percentage of budget_ceiling consumed)
  # At each threshold, the system progressively downgrades non-heavy tasks.
  budget_pressure:
    moderate: 50    # Start slight downgrades
    high: 75        # More aggressive downgrades
    critical: 90    # Maximum downgrades, protect only heavy tasks

# ── Execution Strategy ────────────────────────────────────────
execution:
  # Tasks that MUST run in the current session (not spawned to agents)
  # These tasks are too risky or interconnected to run in isolated contexts
  prefer_in_session:
    - "integration"        # Cross-module integration requires full context
    - "safety-critical"    # Security/auth changes need human oversight
    - "refactoring"        # Refactors touch many files — need session awareness

  # Tasks suitable for parallel agent execution (isolated, well-bounded)
  prefer_agent:
    - "ui"                 # UI components are self-contained
    - "tests"              # Test files are independent
    - "documentation"      # Docs don't affect runtime code
    - "scaffolding"        # Boilerplate generation is isolated

# ── Git Configuration ─────────────────────────────────────────
git:
  # Each task = one atomic commit (no multi-task commits)
  atomic_commits: true

  # Automatically create feature branches per phase
  auto_branch: true

  # Branch naming pattern
  # {NN} = zero-padded phase number, {name} = slugified phase name
  branch_pattern: "titan/phase-{NN}-{name}"

  # Commit message format (enforced by TITAN)
  # {NN} = phase number, {description} = imperative description
  commit_format: "titan(phase-{NN}): {description}"

  # Never force-push — TITAN protects git history
  force_push: false

  # Commit verification — require all checks pass before commit
  verify_before_commit: true

  # Git isolation strategy (Cannibalized from GSD-2)
  # Controls how TITAN isolates work from the main branch.
  #
  # Options:
  #   branch   — (default) One branch per phase, merged at ship.
  #              Classic model. Each phase gets titan/phase-NN-name.
  #
  #   worktree — Each phase works in a git worktree at .titan/worktrees/NN-name/.
  #              Complete file isolation. No branch switching needed.
  #              Avoids planning artifact invisibility across branches.
  #              One squash-merge per milestone to main. Best for complex projects.
  #
  #   none     — All commits directly to current branch.
  #              No isolation. Supports hot-reload workflows.
  #              Best for small projects or single-phase work.
  isolation: "branch"

  # For worktree mode: directory for worktrees
  worktree_dir: ".titan/worktrees"

  # Commit planning artifacts to git (not just code)
  # When true, PLAN.md, SUMMARY.md, etc. are tracked in git.
  # This prevents context loss when switching branches.
  commit_docs: true

# ── Reconciliation ────────────────────────────────────────────
# Reconciliation ensures STATE.md matches actual project state.
# Runs after every phase and before planning.
reconciliation:
  # Whether reconciliation is required (strongly recommended)
  mandatory: true

  # How much deviation from plan is tolerable before flagging
  # Options: strict | moderate | relaxed
  # strict   — any deviation requires explanation
  # moderate — minor deviations logged, major ones flagged
  # relaxed  — only blocking deviations flagged
  deviation_threshold: "moderate"

  # Cross-check STATE.md against filesystem and git history
  state_consistency_check: true

# ── Context Management ────────────────────────────────────────
# Controls how much context budget each plan consumes.
# Prevents context overflow in long sessions.
context:
  # Target context usage per plan (percentage of context window)
  # Lower = more room for execution, higher = more detailed plans
  target_per_plan: 50

  # Maximum tasks in a single plan (prevents overloaded phases)
  max_tasks_per_plan: 3

  # Context bracket definitions — classify context usage
  # Each bracket defines a range and visual indicator
  brackets:
    green:
      range: "0-50%"       # Comfortable — full planning capacity
      indicator: "◆"
    yellow:
      range: "50-70%"      # Caution — simplify plans, fewer tasks
      indicator: "⚠"
    orange:
      range: "70-85%"      # Warning — minimal plans, consider fresh session
      indicator: "⚠⚠"
    red:
      range: "85-100%"     # Critical — save state, start fresh session
      indicator: "⚠⚠⚠"

  # Auto-shard documents exceeding this line count
  # Creates numbered parts: DOCUMENT_PART_01.md, DOCUMENT_PART_02.md, etc.
  auto_shard_threshold: 500

# ── TDD Mode ──────────────────────────────────────────────────
# Test-Driven Development mode: write tests BEFORE implementation.
# When enabled, TITAN enforces red-green-refactor cycle.
tdd:
  # Strict mode: enforce Red-Green-Refactor for ALL build tasks (The Iron Law)
  # When true: every executor MUST write a failing test before production code.
  # Each task produces 3 commits (red, green, refactor) instead of 1.
  # Toggle via /titan:settings → TDD Mode → TDD Strict
  strict: false

  # Context budget target when TDD is active (lower because tests + impl)
  context_target: 40

# ── Verification ─────────────────────────────────────────────
# Controls how verification (08-verify) behaves.
verification:
  # Whether verification is mandatory (strongly recommended)
  mandatory: true

  # Enable adversarial review (the verifier agent)
  adversarial: true

  # Two-stage review: separate spec compliance from code quality
  # When true (default): 08-verify spawns two verifier agents —
  #   Stage A (spec compliance) then Stage B (code quality)
  # When false: single-pass review across all 5 dimensions (legacy)
  two_stage_review: true

  # Minimum issues per review stage (enforced by HALT CONDITION)
  min_issues: 1

  # Verification commands (Cannibalized from GSD-2)
  # Shell commands to run automatically after each task completes.
  # If any command fails, the executor attempts a fix before advancing.
  # This catches regressions immediately, not during manual verification.
  #
  # Examples:
  #   - "npm run lint"
  #   - "npm run test"
  #   - "cargo check"
  #   - "python -m pytest tests/ -x"
  commands: []

  # Auto-fix: when a verification command fails, should the executor
  # attempt to fix the issue automatically?
  auto_fix: true

  # Maximum fix retries per verification command failure
  max_fix_retries: 2

  # Roadmap reassessment (Cannibalized from GSD-2)
  # After each phase verifies successfully, reassess the roadmap.
  # The roadmap may need adjustment based on what was learned.
  # When true: 08-verify adds a Step 12b that reviews ROADMAP.md
  # against what was built and suggests adjustments.
  reassess_roadmap: true

# ── Autopilot Mode ────────────────────────────────────────────
# Autopilot allows TITAN to execute plans with minimal human intervention.
# Use with caution — recommended only after establishing trust with the framework.
autopilot:
  # Enable autopilot execution (default: false — opt-in)
  enabled: false

  # Pause at checkpoint tasks even in autopilot mode
  # Checkpoints are: human-verify, decision, human-action
  pause_on_checkpoints: true

  # Start each step with fresh context (prevents context drift)
  fresh_context_per_step: true

# ── Quality Score Target ──────────────────────────────────────
# TITAN aims for this quality score on all deliverables.
# Score is assessed by the verifier against domain quality gates.
quality:
  # Target score out of 10 (9.0+ recommended for production)
  target_score: 9.8

  # Minimum acceptable score (below this = phase fails)
  minimum_score: 8.0

  # Whether to run domain-specific quality gates
  domain_gates_enabled: true

# ── Budget & Cost Tracking (Cannibalized from GSD-2) ─────────
# Track token consumption and estimated costs per task/phase/milestone.
# Stored in .titan/metrics.json (auto-created on first task).
budget:
  # Enable cost tracking
  tracking_enabled: true

  # Maximum USD spend per milestone (0 = unlimited)
  # When budget is exceeded, TITAN pauses and warns.
  ceiling: 0

  # Budget enforcement behavior when ceiling is approached
  # Options: warn | pause | halt
  #   warn  — Print warning, continue executing
  #   pause — Pause at next checkpoint, present cost report
  #   halt  — Stop immediately, save state
  enforcement: "pause"

  # After N tasks completed, forecast remaining cost and warn if
  # projected to exceed ceiling.
  forecast_after_tasks: 4

# ── Crash Recovery (Cannibalized from GSD-2) ──────────────────
# Protect against session crashes, timeouts, and interruptions.
crash_recovery:
  # Write a lock file during build execution
  # If a session starts and finds a stale lock, it triggers recovery.
  lock_file: true

  # Location of the lock file
  lock_path: ".titan/build.lock"

  # Track completed units to prevent re-execution after recovery
  completed_units_file: ".titan/completed-units.json"

  # When recovering, synthesize a briefing from surviving artifacts
  forensics: true

# ── Step Mode (Cannibalized from GSD-2) ───────────────────────
# Pause between units for human review. Useful when you want
# oversight without full manual control.
step_mode:
  # Enable pause between tasks during /titan:07-build
  enabled: false

  # Pause between waves (less granular than between tasks)
  pause_between_waves: true

  # Pause between phases during /titan:autopilot
  pause_between_phases: true

# ── Background Captures (Cannibalized from GSD-2) ─────────────
# Capture stray ideas, concerns, and observations during execution
# without interrupting workflow. Stored in .titan/CAPTURES.md.
captures:
  enabled: true

# ── Model Routing (v2.2) ─────────────────────────────────────
# Explicit model assignments per task weight class.
# Used by /titan:07-build to classify tasks before dispatch.
# Override dynamic_routing when you want explicit control.
routing:
  light: "claude-sonnet-4"       # Simple tasks: scaffolding, boilerplate, docs
  standard: "claude-sonnet-4"    # Typical tasks: features, tests, refactors
  heavy: "claude-opus-4"         # Complex tasks: migrations, security, architecture
